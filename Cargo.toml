[workspace]
resolver = "2"
members = [
    "crates/aether-types",
    "crates/aether-crypto",
    "crates/aether-zk",
    "crates/aether-consensus",
    "crates/aether-p2p",
    "crates/aether-vm",
    "crates/aether-state",
    "crates/aether-store",
    "crates/aether-rpc",
    "crates/aether-node",
    "crates/aether-cli",
]

[workspace.package]
version = "1.3.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Aether Protocol Contributors"]
repository = "https://github.com/theworker02/aether-protocol"
description = "Aether Protocol — hybrid L1 reference implementation"
homepage = "https://github.com/theworker02/aether-protocol"
documentation = "https://github.com/theworker02/aether-protocol/tree/main/docs"
keywords = ["blockchain", "zk", "rollup", "hybrid", "consensus"]
categories = ["cryptography", "network-programming"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
blake3 = "1.5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
parking_lot = "0.12"
dashmap = "5"
async-trait = "0.1"
futures = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
ark-std = "0.4"
ark-ff = "0.4"
ark-ec = "0.4"
ark-bn254 = "0.4"
ark-groth16 = { version = "0.4", features = ["r1cs"] }
ark-relations = "0.4"
ark-r1cs-std = "0.4"
ark-snark = "0.4"
ark-serialize = { version = "0.4", features = ["derive"] }
ark-crypto-primitives = { version = "0.4", default-features = false, features = ["r1cs", "crh", "merkle_tree"] }

aether-types = { path = "crates/aether-types", version = "1.3.0" }
aether-crypto = { path = "crates/aether-crypto", version = "1.3.0" }
aether-zk = { path = "crates/aether-zk", version = "1.3.0" }
aether-consensus = { path = "crates/aether-consensus", version = "1.3.0" }
aether-p2p = { path = "crates/aether-p2p", version = "1.3.0" }
aether-vm = { path = "crates/aether-vm", version = "1.3.0" }
aether-state = { path = "crates/aether-state", version = "1.3.0" }
aether-store = { path = "crates/aether-store", version = "1.3.0" }
aether-rpc = { path = "crates/aether-rpc", version = "1.3.0" }
