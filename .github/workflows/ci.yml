name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build -p aether-node -p aether-cli
      - name: Test ZK
        run: cargo test -p aether-zk --lib
      - name: Test types/crypto
        run: cargo test -p aether-types -p aether-crypto --lib || true

  explorer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/explorer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/explorer/package-lock.json
      - run: npm ci
      - run: npm run build
