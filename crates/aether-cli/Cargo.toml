tokio = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
ark-bn254 = { workspace = true }
ark-ff = { workspace = true }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
